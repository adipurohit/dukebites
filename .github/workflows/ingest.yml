name: Collect food events

on:
  schedule:
    - cron: '15 */2 * * *'        # Duke Calendar + DukeGroups every 2 hours
    - cron: '30 10,22 * * *'      # Instagram twice a day (before the 11:00 UTC email)
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pick sources
        id: pick
        run: |
          if [ "${{ github.event.schedule }}" = "30 10,22 * * *" ]; then
            echo "sources=instagram" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "sources=duke-calendar,dukegroups,instagram" >> "$GITHUB_OUTPUT"
          else
            echo "sources=duke-calendar,dukegroups" >> "$GITHUB_OUTPUT"
          fi
      - name: Ingest
        run: node ingest/run.mjs --sources ${{ steps.pick.outputs.sources }}
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_LOOKBACK_HOURS: '14'
